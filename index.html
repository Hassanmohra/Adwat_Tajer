
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>أدوات التاجر | ضغط الصور</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #131d30;
      --panel2: #19263b;
      --accent: #25c6a5;
      --text: #f5f7fb;
      --muted: #a4b2c7;
      --border: #2a3a50;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    .container {
      width: min(100% - 28px, 1000px);
      margin: auto;
    }

    header {
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      background: #101827;
    }

    .brand {
      font-size: 25px;
      font-weight: bold;
      color: var(--accent);
    }

    .brand span { color: white; }

    .hero {
      text-align: center;
      padding: 38px 0 24px;
    }

    .hero h1 {
      font-size: clamp(27px, 5vw, 42px);
      line-height: 1.4;
      margin: 0 0 12px;
    }

    .hero p, .muted { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .dropzone {
      display: block;
      text-align: center;
      padding: 32px 15px;
      border: 2px dashed #3a6071;
      border-radius: 16px;
      background: #111d2c;
      cursor: pointer;
      transition: .2s;
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: #152b38;
    }

    .upload-icon {
      font-size: 42px;
      display: block;
    }

    input[type="file"] { display: none; }

    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #0d1727;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font: inherit;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 19px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .primary {
      background: var(--accent);
      color: #071b1a;
    }

    .secondary {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    #status {
      color: var(--muted);
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .progress {
      height: 7px;
      background: #273449;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    #bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .2s;
    }

    #out {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .image-card {
      min-width: 0;
      padding: 12px;
      border-radius: 15px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .image-card img {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #0a0e16;
      border-radius: 9px;
    }

    .image-card textarea {
      margin-top: 10px;
      min-height: 100px;
      resize: vertical;
      font-size: 13px;
    }

    .image-card button {
      width: 100%;
      margin-top: 8px;
    }

    .image-info {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 25px 0 35px;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .panel { padding: 16px; }
      .actions button { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="brand">أدوات <span>التاجر</span></div>
      <div class="muted">أدوات بسيطة تساعدك في تجهيز صور منتجاتك</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>اضغط صور منتجاتك بسهولة</h1>
      <p>قلّل حجم الصور، جهّز وصف منتجاتك، وحمّل الصور بعد معالجتها.</p>
    </section>

    <section class="panel">
      <h2>١. اختر صور المنتجات</h2>

      <label class="dropzone" for="fileInput">
        <span class="upload-icon">📸</span>
        <strong>اضغط هنا لاختيار الصور</strong>
        <div class="muted">يمكنك اختيار عدة صور معًا</div>
      </label>
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>

      <div id="selected" class="muted">لم يتم اختيار صور بعد.</div>

      <div class="settings">
        <div class="field">
          <label for="productName">اسم المنتج</label>
          <input id="productName" type="text" value="منتج" placeholder="مثال: حقيبة نسائية">
        </div>

        <div class="field">
          <label for="phone">رقم واتساب للعلامة المائية</label>
          <input id="phone" type="text" placeholder="أدخل رقم واتساب">
        </div>

        <div class="field">
          <label for="width">عرض الصورة بعد الضغط</label>
          <select id="width">
            <option value="600">600 بكسل</option>
            <option value="900" selected>900 بكسل</option>
            <option value="1200">1200 بكسل</option>
            <option value="1600">1600 بكسل</option>
          </select>
        </div>

        <div class="field">
          <label for="quality">جودة الصورة: <span id="qualityValue">65%</span></label>
          <input id="quality" type="range" min="30" max="95" value="65">
        </div>
      </div>

      <div class="field" style="margin-top:18px">
        <label for="description">الوصف التسويقي</label>
        <textarea id="description" rows="3">جودة عالية - توصيل لكل غزة.</textarea>
      </div>

      <label class="check">
        <input id="watermark" type="checkbox" checked>
        <span>إضافة علامة مائية إلى الصور</span>
      </label>

      <div class="actions">
        <button id="processBtn" class="primary" type="button">ضغط الصور الآن</button>
        <button id="clearBtn" class="secondary" type="button">مسح الصور</button>
      </div>

      <div id="status" role="status" aria-live="polite">جاهز لاستقبال الصور.</div>
      <div class="progress"><div id="bar"></div></div>
    </section>

    <section id="resultsSection" hidden>
      <div class="panel">
        <h2>٢. الصور الجاهزة</h2>
        <p id="summary" class="muted"></p>
        <div class="actions">
          <button id="dlAll" class="primary" type="button">تنزيل كل الصور</button>
          <button id="copyAll" class="secondary" type="button">نسخ الأوصاف</button>
        </div>
      </div>
      <div id="out"></div>
    </section>
  </main>

  <footer>أدوات التاجر © 2026 — تجهيز صور المنتجات بسهولة</footer>

  <script>
    const fileInput = document.getElementById('fileInput');
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    const processBtn = document.getElementById('processBtn');
    const dlAll = document.getElementById('dlAll');
    const resultsSection = document.getElementById('resultsSection');

    let files = [];
    let urls = [];
    let processing = false;

    fileInput.addEventListener('change', () => {
      files = Array.from(fileInput.files || []);
      document.getElementById('selected').textContent =
        files.length ? 'عدد الصور المختارة: ' + files.length : 'لم يتم اختيار صور بعد.';
    });

    document.getElementById('quality').addEventListener('input', e => {
      document.getElementById('qualityValue').textContent = e.target.value + '%';
    });

    function loadImg(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(img);
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('تعذر فتح الصورة: ' + file.name));
        };

        img.src = objectUrl;
      });
    }

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('تعذر إنشاء الصورة المضغوطة.'));
        }, 'image/jpeg', quality);
      });
    }

    function safeFileName(value) {
      return (value || 'product')
        .trim()
        .replace(/[\\/:*?"<>|]/g, '-')
        .slice(0, 60) || 'product';
    }

    function makeDescription() {
      const name = document.getElementById('productName').value.trim() || 'منتج';
      const description = document.getElementById('description').value.trim();
      const phone = document.getElementById('phone').value.trim();

      return [name, description, phone ? 'للطلب واتساب ' + phone : '']
        .filter(Boolean).join(' - ');
    }

    async function processImages() {
      if (processing) return;

      if (!files.length) {
        status.textContent = 'يرجى اختيار صورة واحدة على الأقل أولًا.';
        return;
      }

      processing = true;
      processBtn.disabled = true;
      urls = [];
      out.replaceChildren();
      resultsSection.hidden = false;
      document.getElementById('bar').style.width = '0%';

      const width = Number(document.getElementById('width').value);
      const quality = Number(document.getElementById('quality').value) / 100;
      const watermark = document.getElementById('watermark').checked;
      const phone = document.getElementById('phone').value.trim();
      const name = safeFileName(document.getElementById('productName').value);

      try {
        for (let index = 0; index < files.length; index++) {
          const file = files[index];
          status.textContent = 'جاري ضغط الصورة ' + (index + 1) + ' من ' + files.length + '...';

          const img = await loadImg(file);
          const scale = Math.min(1, width / img.width);
          const W = Math.max(1, Math.round(img.width * scale));
          const H = Math.max(1, Math.round(img.height * scale));
          const extra = watermark ? 35 : 0;

          const canvas = document.createElement('canvas');
          canvas.width = W;
          canvas.height = H + extra;

          const ctx = canvas.getContext('2d');
          if (!ctx) throw new Error('المتصفح لا يدعم معالجة الصور.');

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, W, H);

          if (watermark) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, H, W, 35);
            ctx.fillStyle = '#f5c518';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(
              ('للطلب ' + (phone || 'تواصل معنا')).slice(0, 90),
              W / 2,
              H + 18,
              Math.max(1, W - 20)
            );
          }

          const blob = await canvasToBlob(canvas, quality);
          const url = URL.createObjectURL(blob);
          const outputName = name + '-' + (index + 1) + '.jpg';

          urls.push({
            url,
            name: outputName,
            size: blob.size,
            description: makeDescription()
          });

          const card = document.createElement('article');
          card.className = 'image-card';

          const preview = document.createElement('img');
          preview.src = url;
          preview.alt = 'معاينة الصورة المضغوطة';
          preview.loading = 'lazy';

          const info = document.createElement('div');
          info.className = 'image-info';
          info.textContent = outputName + ' — ' + (blob.size / 1024).toFixed(1) + ' KB';

          const desc = document.createElement('textarea');
          desc.className = 'desc';
          desc.setAttribute('aria-label', 'وصف المنتج');
          desc.value = makeDescription();

          const download = document.createElement('button');
          download.type = 'button';
          download.className = 'secondary';
          download.textContent = 'تنزيل هذه الصورة';
          download.addEventListener('click', () => downloadOne(url, outputName));

          card.append(preview, info, desc, download);
          out.appendChild(card);

          canvas.width = 1;
          canvas.height = 1;

          document.getElementById('bar').style.width =
            Math.round(((index + 1) / files.length) * 100) + '%';
        }

        status.textContent = 'اكتمل الضغط بنجاح! عدد الصور: ' + urls.length;
        document.getElementById('summary').textContent =
          'تم تجهيز ' + urls.length + ' صورة. يمكنك تنزيلها أو نسخ أوصاف المنتجات.';
        dlAll.disabled = false;
      } catch (error) {
        status.textContent = 'حدث خطأ: ' + error.message;
      } finally {
        processing = false;
        processBtn.disabled = false;
      }
    }

    function downloadOne(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadAll() {
      if (!urls.length) return;

      status.textContent = 'سيبدأ تنزيل الصور واحدة تلو الأخرى.';
      for (let i = 0; i < urls.length; i++) {
        downloadOne(urls[i].url, urls[i].name);
        await new Promise(resolve => setTimeout(resolve, 500));
      }
      status.textContent = 'تم إرسال طلبات تنزيل الصور إلى المتصفح.';
    }

    async function copyAllDescriptions() {
      const descriptions = Array.from(out.querySelectorAll('.desc'))
        .map((el, i) => (i + 1) + '. ' + el.value)
        .join('\n');

      try {
        await navigator.clipboard.writeText(descriptions);
        status.textContent = 'تم نسخ أوصاف المنتجات.';
      } catch {
        status.textContent = 'تعذر النسخ التلقائي. حدد الأوصاف وانسخها يدويًا.';
      }
    }

    function clearImages() {
      if (processing) return;

      urls.forEach(item => URL.revokeObjectURL(item.url));
      urls = [];
      files = [];
      fileInput.value = '';
      out.replaceChildren();
      resultsSection.hidden = true;
      document.getElementById('selected').textContent = 'لم يتم اختيار صور بعد.';
      document.getElementById('bar').style.width = '0%';
      status.textContent = 'تم مسح الصور. يمكنك البدء من جديد.';
    }

    processBtn.addEventListener('click', processImages);
    dlAll.addEventListener('click', downloadAll);
    document.getElementById('copyAll').addEventListener('click', copyAllDescriptions);
    document.getElementById('clearBtn').addEventListener('click', clearImages);
  </script>
</body>
</html>
